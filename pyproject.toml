[project]
name = "etho"
version = "0.1.0"
description = "Zero-shot animal behavior scoring with Meta models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "ijson>=3.6.0",
    "meta-sam-parser>=0.1.0",
    "numba>=0.68.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pycocotools>=2.0.8",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etho"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]
addopts = "-q"
markers = ["bench: lightweight throughput benchmark (a few seconds at most)"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
