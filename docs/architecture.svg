<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Etho architecture</title>
  <desc>Lab video and plain-English definitions flow through five stages: perception planner (Muse Spark), tracking (SAM 3.1), rule synthesis in a sandbox (Muse Spark), frame-strip check (Muse Spark Open), and report (Muse Spark). A correction loop sends user fixes back to rule synthesis. Every model call goes through the Etho gateway, which caps spend, caches calls and logs to a ledger.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4450"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="80" y="110" font-size="56" font-weight="700" fill="#1b1f24">How Etho works</text>
  <text x="80" y="165" font-size="30" fill="#4a5260">Everything around the models was built during the hackathon (Oct 26 - Nov 4)</text>

  <!-- inputs -->
  <rect x="80" y="250" width="250" height="250" rx="16" fill="#f3f4f6" stroke="#9aa1ab" stroke-width="2"/>
  <text x="205" y="320" font-size="30" font-weight="700" text-anchor="middle" fill="#1b1f24">Inputs</text>
  <text x="205" y="375" font-size="26" text-anchor="middle" fill="#1b1f24">Lab video</text>
  <text x="205" y="415" font-size="26" text-anchor="middle" fill="#1b1f24">+ one sentence</text>
  <text x="205" y="450" font-size="26" text-anchor="middle" fill="#1b1f24">per behavior,</text>
  <text x="205" y="485" font-size="26" text-anchor="middle" fill="#1b1f24">in plain English</text>

  <!-- stages: x positions 390, 690, 990, 1290, 1590 ; width 260 -->
  <g font-size="26" text-anchor="middle" fill="#1b1f24">
    <rect x="390" y="250" width="260" height="250" rx="16" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="3"/>
    <text x="520" y="300" font-size="22" fill="#3b6fd6" font-weight="700">1</text>
    <text x="520" y="345" font-weight="700">Planner</text>
    <text x="520" y="390">picks what</text>
    <text x="520" y="425">to track</text>
    <text x="520" y="475" font-size="22" font-weight="700" fill="#3b6fd6">Muse Spark 1.3</text>

    <rect x="690" y="250" width="260" height="250" rx="16" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="3"/>
    <text x="820" y="300" font-size="22" fill="#3b6fd6" font-weight="700">2</text>
    <text x="820" y="345" font-weight="700">Tracking</text>
    <text x="820" y="390">masks, identity,</text>
    <text x="820" y="425">per-frame features</text>
    <text x="820" y="475" font-size="22" font-weight="700" fill="#3b6fd6">SAM 3.1</text>

    <rect x="990" y="250" width="260" height="250" rx="16" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="3"/>
    <text x="1120" y="300" font-size="22" fill="#3b6fd6" font-weight="700">3</text>
    <text x="1120" y="345" font-weight="700">Rules</text>
    <text x="1120" y="390">definition to Python,</text>
    <text x="1120" y="425">run in a sandbox</text>
    <text x="1120" y="475" font-size="22" font-weight="700" fill="#3b6fd6">Muse Spark 1.3</text>

    <rect x="1290" y="250" width="260" height="250" rx="16" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="3"/>
    <text x="1420" y="300" font-size="22" fill="#3b6fd6" font-weight="700">4</text>
    <text x="1420" y="345" font-weight="700">Frame-strip check</text>
    <text x="1420" y="390">6 frames per</text>
    <text x="1420" y="425">borderline moment</text>
    <text x="1420" y="475" font-size="22" font-weight="700" fill="#3b6fd6">Muse Spark Open</text>

    <rect x="1590" y="250" width="260" height="250" rx="16" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="3"/>
    <text x="1720" y="300" font-size="22" fill="#3b6fd6" font-weight="700">5</text>
    <text x="1720" y="345" font-weight="700">Report</text>
    <text x="1720" y="390">ethogram, metrics,</text>
    <text x="1720" y="425">full audit trail</text>
    <text x="1720" y="475" font-size="22" font-weight="700" fill="#3b6fd6">Muse Spark 1.3</text>
  </g>
  <g stroke="#3d4450" stroke-width="4" marker-end="url(#arrow)">
    <line x1="332" y1="375" x2="384" y2="375"/>
    <line x1="652" y1="375" x2="684" y2="375"/>
    <line x1="952" y1="375" x2="984" y2="375"/>
    <line x1="1252" y1="375" x2="1284" y2="375"/>
    <line x1="1552" y1="375" x2="1584" y2="375"/>
  </g>

  <!-- correction loop: from report back to rules -->
  <path d="M1720,502 L1720,600 L1120,600 L1120,508" fill="none" stroke="#b5671f" stroke-width="4" stroke-dasharray="14 8" marker-end="url(#arrow)"/>
  <rect x="1250" y="572" width="340" height="56" rx="10" fill="#ffffff"/>
  <text x="1420" y="610" font-size="26" text-anchor="middle" font-weight="700" fill="#8a4a10">6  Correction loop</text>
  <text x="1420" y="655" font-size="24" text-anchor="middle" fill="#4a5260">researcher fixes a few bouts; the rule is rewritten</text>

  <!-- gateway -->
  <g stroke="#6b7280" stroke-width="3" stroke-dasharray="4 6">
    <line x1="520" y1="502" x2="520" y2="760"/>
    <line x1="820" y1="502" x2="820" y2="760"/>
    <line x1="1050" y1="502" x2="1050" y2="760"/>
    <line x1="1420" y1="672" x2="1420" y2="760"/>
    <line x1="1720" y1="612" x2="1720" y2="760"/>
  </g>
  <rect x="390" y="760" width="1460" height="150" rx="16" fill="#1b1f24"/>
  <text x="1120" y="822" font-size="34" font-weight="700" text-anchor="middle" fill="#ffffff">Etho gateway: every model call</text>
  <text x="1120" y="874" font-size="28" text-anchor="middle" fill="#d1d5db">hard spend caps · on-disk cache (never pay twice) · ledger of every call · reasoning effort set on every call</text>

  <text x="80" y="1010" font-size="24" fill="#4a5260">Code: etho/gateway (caps, cache, ledger) · etho/tracking · etho/rules/sandbox.py · etho/adjudication/tier1.py · etho/app</text>
</svg>
